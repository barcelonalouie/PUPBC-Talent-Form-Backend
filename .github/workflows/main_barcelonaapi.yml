name: Build and deploy Node.js app to Azure Web App - BarcelonaAPI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: npm install and build
        run: |
          if [ -f "package.json" ]; then
            npm install
          elif [ -d "expressNodeApp" ]; then
            cd expressNodeApp && npm install
          fi

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # Change this to match where your package.json is
          path: . 

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A39BB3B9506444A09EC43AA0D3958113 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9EC32063ACC34E96AC4E9355836EB6E4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_02FA01DDBC314F72ADBB4F3EA3A89305 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'BarcelonaAPI'
          # This ensures Azure looks at the root of the downloaded files
          package: .
